tag: FEMBA_pretrain
gpus: 4
num_nodes: 1
num_workers: 8
batch_size: 256
seed: 42
resume: true
pretrained_checkpoint: null
load_state_dict: false
training: true
print_model: true
find_unused_parameters: false
model_checkpoint:
  save_last: true
  save_top_k: 1
  monitor: val_loss
  mode: min
callbacks:
  lr_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
io:
  version: 0
  checkpoint_dirpath: ${env:CHECKPOINT_DIR}/checkpoints
  base_output_path: ${env:DATA_PATH}/outputs
trainer:
  num_nodes: ${num_nodes}
  devices: ${gpus}
  strategy: auto
  max_epochs: 2
  max_steps: 500000
  benchmark: true
  log_every_n_steps: 25
  check_val_every_n_epoch: 1
  val_check_interval: null
  num_sanity_val_steps: 0
  accelerator: gpu
  gradient_clip_val: 1
optimizer:
  optim: LAMB
  lr: 0.001
masking:
  patch_size:
  - 2
  - 16
  masking_ratio: 0.6
input_normalization:
  normalize: true
  quartile_normalization_lower_val: -20
  quartile_normalization_upper_val: 20
data_module:
  _target_: data_module.pretrain_data_module.PretrainDataModule
  name: eeg
  cfg:
    num_workers: ${num_workers}
    batch_size: ${batch_size}
  test: null
  train_val_split_ratio: 0.8
  datasets:
    demo_dataset: null
    TUEG_22_channels_0:
      _target_: datasets.hdf5_dataset.HDF5Loader
      finetune: false
      hdf5_file: '#CHANGEME'

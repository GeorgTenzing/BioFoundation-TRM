tag: trm_basicmotions_sanitycheck
gpus: 1
num_nodes: 1
num_workers: 2
batch_size: 2
seed: 42
resume: true
pretrained_checkpoint: null
load_state_dict: false
training: true
print_model: true
find_unused_parameters: false
model_checkpoint:
  save_last: true
  save_top_k: 1
  monitor: val_psnr
  mode: max
callbacks:
  lr_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
io:
  version: 0
  base_output_path: ${env:DATA_PATH}/outputs
  checkpoint_dirpath: ${env:CHECKPOINT_DIR}/checkpoints
trainer:
  num_nodes: ${num_nodes}
  devices: ${gpus}
  strategy: auto
  max_epochs: null
  max_steps: 500000
  benchmark: true
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  val_check_interval: null
  num_sanity_val_steps: 0
optimizer:
  optim: AdamW
  lr: 0.0001
masking:
  patch_size:
  - 2
  - 16
  masking_ratio: 0.6
input_normalization:
  normalize: true
  quartile_normalization_lower_val: -20
  quartile_normalization_upper_val: 20
data_module:
  data_module:
    _target_: data_module.pretrain_data_module.PretrainDataModule
    name: uea_basicmotions
    cfg:
      num_workers: ${num_workers}
      batch_size: ${batch_size}
    test: null
    train_val_split_ratio: 0.8
    datasets:
      demo_dataset: null
      BasicMotions_train:
        _target_: datasets.hdf5_dataset.HDF5Loader
        finetune: true
        hdf5_file: ${env:DATA_PATH}/make_datasets/Datasets/UEA/BasicMotions/processed/train.h5
      BasicMotions_test:
        _target_: datasets.hdf5_dataset.HDF5Loader
        finetune: true
        hdf5_file: ${env:DATA_PATH}/make_datasets/Datasets/UEA/BasicMotions/processed/test.h5
task:
  _target_: tasks.finetune_task.FinetuneTask
scheduler:
  _target_: schedulers.multi_step_lr.multi_step_lr
  milestones: 200000+400000
  gamma: 0.5
  warmup_iter: -1
  warmup_init_lr: 0
model:
  _target_: models._TRM.TCN
  num_classes: 4
criterion:
  _target_: torch.nn.CrossEntropyLoss
pretrained_checkpoint_path: null

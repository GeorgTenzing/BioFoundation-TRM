# @package _global_
data_module:
  _target_: 'data_module.pretrain_data_module.PretrainDataModule'
  name: "uea_basicmotions"
  cfg:
    num_workers: ${num_workers}
    batch_size: ${batch_size}
  test: null
  train_val_split_ratio: 0.8
  datasets:
    demo_dataset: null
    TUEG_22_channels_0:
      _target_: datasets.hdf5_dataset.HDF5Loader
      finetune: False
      hdf5_file: '${env:DATA_PATH}/make_datasets/Datasets/UEA/BasicMotions/processed/train.h5'

